spring.application.name=assistant-service
server.address=127.0.0.1
server.port=8058
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.model=openai/gpt-oss-20b
spring.ai.openai.chat.parallel-tool-calls=false
spring.ai.openai.chat.replay-reasoning-content=false
spring.ai.mcp.client.name=bank-assistant
spring.ai.mcp.client.streamable-http.connections.account.url=http://localhost:8056
spring.ai.mcp.client.streamable-http.connections.transaction.url=http://localhost:8057
app.telegram.enabled=false
app.telegram.token=${TELEGRAM_BOT_TOKEN:}
app.telegram.allowed-chat-id=${TELEGRAM_ALLOWED_CHAT_ID:}
